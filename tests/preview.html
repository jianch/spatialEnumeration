<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mouse trial preview</title><link rel="stylesheet" href="../vendor/jspsych.css"><link rel="stylesheet" href="../styles.css"></head><body>
<div id="experiment"><div class="intro"><h1>Mouse trial preview</h1><p>One isolated inspection trial. The cursor returns below fixation automatically before the timed trial. The cue lasts 2 seconds and the response window lasts 15 seconds so the layout can be examined. These are preview settings, not pilot settings. No recovery records are saved.</p><button id="begin-preview">Start preview</button></div></div>
<script src="../vendor/jspsych.js"></script><script src="../vendor/plugin-html-button-response.js"></script><script src="../config.js"></script><script src="../design.js"></script><script src="../display.js"></script><script src="../audio.js"></script><script src="../plugin-enumeration.js"></script>
<script>document.getElementById('begin-preview').addEventListener('click',async()=>{
 const mouseReady=EnumerationMouse.acquire();mouseReady.catch(()=>{});
 const C=structuredClone(EnumerationConfig);C.timing.cueMs=2000;C.timing.responseDeadlineMs=15000;C.timing.itiMs=0;
 let result;const j=initJsPsych({display_element:'experiment',...EnumerationAudio.initializationOptions(location.protocol),on_finish:()=>{EnumerationMouse.release();document.getElementById('experiment').innerHTML='<div class="intro"><h1>Preview complete</h1><p id="preview-result"></p></div>';document.getElementById('preview-result').textContent=JSON.stringify({response:result.response,method:result.response_method,rt_pad_ms:result.rt_pad_ms,continuous_fixation:true,arrow_above_cross_deg:result.cue_center_above_fixation_deg});}});
 await mouseReady;await EnumerationAudio.unlock(j);document.getElementById('experiment').replaceChildren();
 const pixelsPerMm=screen.width/(C.geometry.defaultScreenWidthCm*10);EnumerationDisplay.applyCalibration(C,pixelsPerMm);
 const stamps=[];let previous;for(let i=0;i<40;i++){const stamp=await new Promise(r=>requestAnimationFrame(r));if(previous&&i>5)stamps.push(stamp-previous);previous=stamp;}stamps.sort((a,b)=>a-b);
 await j.run([
 {type:jsPsychEnumeration,row:{task:'enumeration',phase:'layout_preview',target_numerosity:6,target_side:'left',cue_validity:'valid',cue_meaning:'left',cue_symbol:'arrow-left',fixation_ms:1000,array_duration_ms:300,signal_delay_ms:400,mask_seed:'preview-mask',dot_coordinates_deg:EnumerationDesign.generateDots(6,C.geometry,'preview-dots')},settings:{config:C,frameMs:stamps[Math.floor(stamps.length/2)],pixelsPerDegree:EnumerationDesign.pixelsPerDegree(C.geometry.defaultScreenWidthCm,C.geometry.defaultViewingDistanceCm,screen.width),pixelsPerMm,requireFullscreen:false},on_finish:r=>{result=r;}}]);
});</script></body></html>
